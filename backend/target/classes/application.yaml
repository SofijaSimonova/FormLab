spring:
  application:
    name: FormLab

  liquibase:
      change-log: classpath:/db/changelog/changelog-master.xml
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/formLabDatabase}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:cvet4eto}
